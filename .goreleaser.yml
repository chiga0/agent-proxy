version: 2

builds:
  - main: ./cmd/agent-proxy
    binary: agent-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

brews:
  - name: agent-proxy
    repository:
      owner: chiga0
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/chiga0/agent-proxy"
    description: "Domain-based selective proxy CLI for overseas ECS"
    license: "MIT"
    install: |
      bin.install "agent-proxy"
    test: |
      system "#{bin}/agent-proxy", "version"

release:
  github:
    owner: chiga0
    name: agent-proxy
  draft: false
  prerelease: auto
