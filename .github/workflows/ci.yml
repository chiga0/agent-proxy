name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Format check
        if: runner.os != 'Windows'
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build ./cmd/agent-proxy

      - name: Test
        run: go test ./...

      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Test SSH ControlMaster (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Generate a test key
          ssh-keygen -t ed25519 -f $env:TEMP\test_key -N '""' -q
          # Test ControlMaster socket creation (will fail to connect but should create socket)
          $ctrlPath = "$env:TEMP\ssh-ctrl-test"
          ssh -o ControlMaster=auto -o ControlPath=$ctrlPath -o ConnectTimeout=2 -o BatchMode=yes -i $env:TEMP\test_key nobody@127.0.0.1 2>$null
          # Check if socket was created
          if (Test-Path $ctrlPath) { Write-Host "ControlMaster socket created OK" } else { Write-Host "WARNING: ControlMaster socket not created"; exit 0 }
          # Clean exit
          ssh -o ControlPath=$ctrlPath -O exit nobody@127.0.0.1 2>$null
          Write-Host "ControlMaster exit OK"
          exit 0

  squid-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Squid ACL integration tests
        run: bash test/squid/integration_test.sh
