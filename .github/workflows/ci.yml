name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Format check
        if: runner.os != 'Windows'
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted:"
            echo "$UNFORMATTED"
            echo "Run: gofmt -w ."
            exit 1
          fi

      - name: Build
        run: go build ./cmd/agent-proxy

      - name: Test
        run: go test ./...

      - name: Test (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

  squid-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Squid ACL integration tests
        run: bash test/squid/integration_test.sh
